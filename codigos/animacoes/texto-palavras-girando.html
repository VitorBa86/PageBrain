<!--
  SNIPPET: Texto com palavras girando
  CATEGORIA: animacoes
  O QUE FAZ: Frase fixa seguida de uma palavra que troca sozinha (rolando para cima) em loop.
  COMO USAR: Crie um widget HTML, cole o arquivo inteiro. Troque as palavras dentro de .words e a cor #956afa.
  ONDE COLAR: Widget HTML
  DEPENDÊNCIAS: Fonte Poppins (opcional)
  ORIGEM: coleção original da casa (textomudando)
  USADO EM: nenhuma página publicada encontrada (só na biblioteca)
-->

<style>
.card {
  --bg-color: #212121;
  background-color: var(--bg-color);
  padding: 1rem 2rem;
  border-radius: 1.25rem;
}
.loader {
  color: rgb(124, 124, 124);
  font-family: "Poppins", sans-serif;
  font-weight: 500;
  font-size: 25px;
  -webkit-box-sizing: content-box;
  box-sizing: content-box;
  height: 40px;
  padding: 10px 10px;
  display: -webkit-box;
  display: -ms-flexbox;
  display: flex;
  border-radius: 8px;
}

.words {
  overflow: hidden;
  position: relative;
}
.words::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    var(--bg-color) 10%,
    transparent 30%,
    transparent 70%,
    var(--bg-color) 90%
  );
  z-index: 20;
}

.word {
  display: block;
  height: 100%;
  padding-left: 6px;
  color: #956afa;
  animation: spin_4991 4s infinite;
}

@keyframes spin_4991 {
  10% {
    -webkit-transform: translateY(-102%);
    transform: translateY(-102%);
  }

  25% {
    -webkit-transform: translateY(-100%);
    transform: translateY(-100%);
  }

  35% {
    -webkit-transform: translateY(-202%);
    transform: translateY(-202%);
  }

  50% {
    -webkit-transform: translateY(-200%);
    transform: translateY(-200%);
  }

  60% {
    -webkit-transform: translateY(-302%);
    transform: translateY(-302%);
  }

  75% {
    -webkit-transform: translateY(-300%);
    transform: translateY(-300%);
  }

  85% {
    -webkit-transform: translateY(-402%);
    transform: translateY(-402%);
  }

  100% {
    -webkit-transform: translateY(-400%);
    transform: translateY(-400%);
  }
}
</style>

<div class="card">
  <div class="loader">
    <p>Templates</p>
    <div class="words">
      <span class="word">Turbo</span>
      <span class="word">CSS</span>
      <span class="word">Docs</span>
      <span class="word">Cards</span>
      <span class="word">Botões</span>
    </div>
  </div>
</div>
